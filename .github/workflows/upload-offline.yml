name: Restore offline image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing released image version, without the v prefix
        required: true
        default: '0.1.25'
      arch:
        description: CPU architecture to restore
        type: choice
        required: true
        default: amd64
        options: [amd64, arm64]

permissions:
  contents: read

jobs:
  upload:
    concurrency:
      group: drive-base-images-cangling-map
      cancel-in-progress: false
    name: Restore ${{ inputs.arch }} offline image
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout upload scripts
        uses: actions/checkout@v5

      - name: Set up Python for drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test webhook client
        run: python scripts/test-release-via-webhook.py

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Cangling registry
        uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Publish the existing released image through webhook
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.arch }}
          RELEASE_WEBHOOK_URL: ${{ vars.RELEASE_WEBHOOK_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source="harbor.cangling.cn:22002/cangling/cangling-map:${RELEASE_VERSION}-${ARCH}"
          digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          python scripts/release-via-webhook.py --project cangling-map --version "$RELEASE_VERSION" --digest "$digest" --arch "$ARCH" --allow-downgrade
