name: Restore offline image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing released image version, without the v prefix
        required: true
        default: '0.1.25'
      arch:
        description: CPU architecture to restore
        type: choice
        required: true
        default: amd64
        options: [amd64, arm64]

permissions:
  contents: read

jobs:
  upload:
    concurrency:
      group: drive-base-images-cangling-map
      cancel-in-progress: false
    name: Restore ${{ inputs.arch }} offline image
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout upload scripts
        uses: actions/checkout@v5

      - name: Set up Python for drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test drive image uploader
        run: python scripts/test-upload-drive-image.py

      - name: Login to Cangling registry
        uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Export and upload the existing released image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ARCH: ${{ inputs.arch }}
          WRITE_TOKEN: ${{ secrets.WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARCH" == amd64 || "$ARCH" == arm64 ]]
          : "${WRITE_TOKEN:?Configure WRITE_TOKEN before uploading}"
          source="harbor.cangling.cn:22002/cangling/cangling-map:${RELEASE_VERSION}-${ARCH}"
          offline="hub.cangling.cn/cangling/cangling-map:${RELEASE_VERSION}"
          filename="cangling-map-linux-${ARCH}.tar.gz"
          mkdir -p dist
          docker pull --platform "linux/${ARCH}" "$source"
          test "$(docker image inspect "$source" --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect "$source" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_VERSION"
          docker tag "$source" "$offline"
          docker save "$offline" | gzip -n > "dist/${filename}"
          python scripts/upload-drive-image.py --project cangling-map --arch "$ARCH" --file "dist/${filename}"
