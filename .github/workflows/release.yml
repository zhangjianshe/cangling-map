name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: harbor.cangling.cn:22002/cangling/cangling-map

permissions:
  contents: read

jobs:
  docker:
    name: publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cangling-map
        uses: actions/checkout@v5
        with:
          path: cangling-map

      - name: Read release metadata
        id: meta
        working-directory: cangling-map
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to Cangling registry
        uses: docker/login-action@v4
        with:
          registry: soft.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and publish amd64 + arm64
        uses: docker/build-push-action@v7
        with:
          context: cangling-map
          file: cangling-map/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=cangling-map
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cangling-map-image
          cache-to: type=gha,mode=max,scope=cangling-map-image
          provenance: mode=max
          sbom: true
