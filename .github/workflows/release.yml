name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      smoke_only:
        description: Build and test both CPU architectures without publishing images
        type: boolean
        default: false

env:
  IMAGE: harbor.cangling.cn:22002/cangling/cangling-map

permissions:
  contents: read

jobs:
  metadata:
    name: read release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout cangling-map
        uses: actions/checkout@v5

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }} image
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout cangling-map
        uses: actions/checkout@v5

      - name: Set up native Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Cangling registry
        if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
        uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and publish ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_only }}
          load: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_only }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=cangling-map
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cangling-map-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cangling-map-${{ matrix.arch }}
          provenance: ${{ (github.event_name != 'workflow_dispatch' || !inputs.smoke_only) && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_only }}


      - name: Verify native image runtime and rendering
        shell: bash
        run: |
          image="${IMAGE}:${{ needs.metadata.outputs.version }}-${{ matrix.arch }}"
          if [[ "${{ inputs.smoke_only }}" != "true" ]]; then docker pull "$image"; fi
          docker image inspect "$image" --format 'Architecture={{.Architecture}} Size={{.Size}}'
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            gdalinfo --version
            test -r "$MAP_FONT_PATH"
            fc-match "Noto Sans CJK SC"
            ldd /usr/local/bin/cangling-map > /tmp/linked-libraries
            ! grep -q "not found" /tmp/linked-libraries
          '
          python3 scripts/test-named-styles.py --image "$image" --platform "linux/${{ matrix.arch }}"

  manifest:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    name: publish multi-arch manifest
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Cangling registry
        uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Create and publish manifests
        shell: bash
        run: |
          sources=(
            "${IMAGE}:${{ needs.metadata.outputs.version }}-amd64"
            "${IMAGE}:${{ needs.metadata.outputs.version }}-arm64"
          )
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ needs.metadata.outputs.version }}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"

      - name: Verify multi-arch image
        shell: bash
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ needs.metadata.outputs.version }}"

      - name: Export and upload offline images to soft.cangling.cn
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CANGLING_TOKEN: ${{ secrets.CANGLING_TOKEN }}
          DATASET_TOKEN: e2a964ab97c0422d9a2000bffff4fb1b
        shell: bash
        run: |
          set -euo pipefail
          : "${CANGLING_TOKEN:?Configure the CANGLING_TOKEN repository secret before publishing to soft.cangling.cn}"
          mkdir -p dist

          upload_file() {
            local filename="$1" arch="$2"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1800 \
              "https://soft.cangling.cn:22002/api/v1/software/upload" \
              -H "API-TOKEN: ${CANGLING_TOKEN}" \
              -F "token=${DATASET_TOKEN}" \
              -F "version=latest" \
              -F "name=${filename}" \
              -F "summary=cangling-map v${RELEASE_VERSION}" \
              -F "os=linux" \
              -F "arch=${arch}" \
              -F "file=@dist/${filename}"
          }

          # Export sequentially: both architectures use the same offline image tag.
          # Keep archive filenames stable so clients can download from /latest/.
          offline_image="hub.cangling.cn/cangling/cangling-map:${RELEASE_VERSION}"
          for arch in amd64 arm64; do
            source_image="${IMAGE}:${RELEASE_VERSION}-${arch}"
            filename="cangling-map-linux-${arch}.tar.gz"
            docker pull --platform "linux/${arch}" "$source_image"
            actual_arch="$(docker image inspect "$source_image" --format '{{.Architecture}}')"
            test "$actual_arch" = "$arch"
            docker tag "$source_image" "$offline_image"
            docker save "$offline_image" | gzip -n > "dist/${filename}"
            (cd dist && sha256sum "$filename" > "${filename}.sha256")
            upload_file "$filename" "$arch"
            upload_file "${filename}.sha256" "$arch"
          done

          # Update the advertised version only after both archives and checksums upload.
          printf 'v%s\n' "$RELEASE_VERSION" > dist/cangling-map-version.txt
          upload_file cangling-map-version.txt all
