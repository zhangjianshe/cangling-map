apiVersion: v1
kind: Namespace
metadata:
  name: cangling-map
---
apiVersion: v1
kind: Secret
metadata:
  name: cangling-tile-credentials
  namespace: cangling-map
type: Opaque
stringData:
  # 部署前必须替换；两个服务通过同一个 Token 进行瓦片写入鉴权。
  auth-token: replace-with-a-long-random-token
  admin-password: replace-with-a-strong-admin-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cangling-map-data
  namespace: cangling-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cangling-tile-data
  namespace: cangling-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cangling-tile-config
  namespace: cangling-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-tile
  namespace: cangling-map
spec:
  selector:
    app.kubernetes.io/name: cangling-tile
  ports:
    - name: http
      port: 7601
      targetPort: http
      nodePort: 30601
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cangling-tile
  namespace: cangling-map
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cangling-tile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cangling-tile
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cangling-tile
          image: harbor.cangling.cn:22002/cangling/cangling-tile:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CANGLING_TILE_ADDR
              value: 0.0.0.0:7601
            - name: CANGLING_TILE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: auth-token
            - name: CANGLING_TILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: admin-password
          ports:
            - name: http
              containerPort: 7601
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tile-data
              mountPath: /app/tiledata
            - name: tile-config
              mountPath: /app/config
      volumes:
        - name: tile-data
          persistentVolumeClaim:
            claimName: cangling-tile-data
        - name: tile-config
          persistentVolumeClaim:
            claimName: cangling-tile-config
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-map-headless
  namespace: cangling-map
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cangling-map
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-map
  namespace: cangling-map
spec:
  selector:
    app.kubernetes.io/name: cangling-map
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cangling-map
  namespace: cangling-map
spec:
  serviceName: cangling-map-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: cangling-map
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cangling-map
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cangling-map
          image: soft.cangling.cn:22002/cangling/cangling-map:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MAP_SERVER_ADDRESS
              value: 0.0.0.0:3000
            - name: CATALOG_DATABASE_URL
              value: sqlite:///data/catalog.db?mode=rwc
            - name: WMTS_CACHE_BACKEND
              value: cangling-tile
            - name: CANGLING_TILE_URL
              value: http://cangling-tile:7601
            - name: CANGLING_TILE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: auth-token
            - name: MAP_CACHE_ROOT
              value: /cache
            - name: MAP_RENDER_BACKEND
              value: cpu
            - name: RUST_LOG
              value: map_server=info,cangling_gdal_core=info,tower_http=info
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: map-data
              mountPath: /data
            - name: map-cache
              mountPath: /cache
            - name: geodata
              mountPath: /opt/cis/core/geoserver/data
              readOnly: true
      volumes:
        - name: map-data
          persistentVolumeClaim:
            claimName: cangling-map-data
        - name: map-cache
          emptyDir: {}
        - name: geodata
          hostPath:
            # 修改为 K3s 节点上的实际地图源数据目录。
            path: /opt/cis/core/geoserver/data
            type: Directory
