apiVersion: v1
kind: Namespace
metadata:
  name: cangling-map
---
apiVersion: v1
kind: Secret
metadata:
  name: cangling-tile-credentials
  namespace: cangling-map
type: Opaque
stringData:
  # 部署前必须替换；两个服务通过同一个 Token 进行瓦片写入鉴权。
  auth-token: replace-with-a-long-random-token
  admin-password: replace-with-a-strong-admin-password
  # 所有 cangling-map 实例必须使用同一个签名密钥，至少 24 字节。
  imagery-lease-secret: replace-with-a-long-random-imagery-lease-secret
  # 必须与单实例 cangling-broker 的 CL_BROKER_AUTH_TOKEN 相同。
  broker-auth-token: replace-with-the-cangling-broker-service-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cangling-tile-data
  namespace: cangling-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cangling-tile-config
  namespace: cangling-map
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-tile
  namespace: cangling-map
spec:
  selector:
    app.kubernetes.io/name: cangling-tile
  ports:
    - name: http
      port: 7601
      targetPort: http
      nodePort: 30601
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cangling-tile
  namespace: cangling-map
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cangling-tile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cangling-tile
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cangling-tile
          image: harbor.cangling.cn:22002/cangling/cangling-tile:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CANGLING_TILE_ADDR
              value: 0.0.0.0:7601
            - name: CANGLING_TILE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: auth-token
            - name: CANGLING_TILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: admin-password
          ports:
            - name: http
              containerPort: 7601
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tile-data
              mountPath: /app/tiledata
            - name: tile-config
              mountPath: /app/config
      volumes:
        - name: tile-data
          persistentVolumeClaim:
            claimName: cangling-tile-data
        - name: tile-config
          persistentVolumeClaim:
            claimName: cangling-tile-config
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-map-headless
  namespace: cangling-map
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cangling-map
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cangling-map
  namespace: cangling-map
spec:
  selector:
    app.kubernetes.io/name: cangling-map
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cangling-map
  namespace: cangling-map
spec:
  serviceName: cangling-map-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: cangling-map
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cangling-map
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: cangling-map
          image: soft.cangling.cn:22002/cangling/cangling-map:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MAP_SERVER_ADDRESS
              value: 0.0.0.0:3000
            - name: CATALOG_DATABASE_URL
              value: sqlite:///data/catalog.db?mode=rwc
            - name: IMAGERY_DATABASE_URL
              value: sqlite:///data/imagery.db?mode=rwc
            - name: IMAGERY_INDEX_DATABASE_URL
              value: sqlite:///data/imagery-index.db?mode=rwc
            - name: IMAGERY_LEASE_SECRET
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: imagery-lease-secret
            - name: CANGLING_BROKER_HTTP_URL
              # 按实际部署命名空间修改；Broker 必须保持单实例。
              value: http://cangling-broker.cangling.svc.cluster.local:7501
            - name: CANGLING_BROKER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: broker-auth-token
            - name: CANGLING_MAP_ELECTION
              value: cangling-map/imagery-repository-master
            - name: CANGLING_MAP_ELECTION_TTL_SECONDS
              value: "15"
            - name: CANGLING_MAP_PEER_URL_TEMPLATE
              value: http://{leader}.cangling-map-headless:3000
            - name: CANGLING_MAP_SNAPSHOT_INTERVAL_SECONDS
              value: "10"
            - name: CANGLING_MAP_CHUNK_TILES
              value: "512"
            - name: CANGLING_MAP_IMAGERY_WORKER_CONCURRENCY
              value: "8"
            - name: CANGLING_MAP_IMAGERY_WORKER_MIN_CONCURRENCY
              value: "1"
            - name: CANGLING_MAP_IMAGERY_TARGET_TILE_MS
              value: "500"
            - name: CANGLING_MAP_HYBRID_TAKEOVER_SECONDS
              value: "120"
            # 逗号分隔的可信瓦片源主机；空值会关闭服务端影像下载 Worker。
            - name: CANGLING_MAP_IMAGERY_SOURCE_HOSTS
              value: ""
            - name: WMTS_CACHE_BACKEND
              value: cangling-tile
            - name: CANGLING_TILE_URL
              value: http://cangling-tile:7601
            - name: CANGLING_TILE_PUBLIC_URL
              value: /cangling-tile
            - name: CANGLING_TILE_STORAGE_ROOT
              value: /app/tiledata
            - name: CANGLING_TILE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cangling-tile-credentials
                  key: auth-token
            - name: MAP_CACHE_ROOT
              value: /cache
            - name: MAP_RENDER_BACKEND
              value: cpu
            - name: RUST_LOG
              value: map_server=info,cangling_gdal_core=info,tower_http=info
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: map-data
              mountPath: /data
            - name: map-cache
              mountPath: /cache
            - name: geodata
              mountPath: /opt/cis/core/geoserver/data
              readOnly: true
      volumes:
        - name: map-cache
          emptyDir: {}
        - name: geodata
          hostPath:
            # 修改为 K3s 节点上的实际地图源数据目录。
            path: /opt/cis/core/geoserver/data
            type: Directory
  volumeClaimTemplates:
    # 每个 Pod 使用独立本地 SQLite。Broker 事件与快照负责同步；
    # 不要让多个 Pod 直接并发打开同一个 SQLite 文件。
    - metadata:
        name: map-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
